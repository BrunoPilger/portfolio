<nav class="navbar" [class.navbar--hidden]="isHidden()">
  <a class="navbar__home" href="#inicio" (click)="onHomeClick($event)" aria-label="Início">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 11.5 12 4l8.5 7.5" />
      <path d="M5.5 10v9a1 1 0 0 0 1 1H9.5v-6h5v6h3a1 1 0 0 0 1-1v-9" />
    </svg>
  </a>

  <ul class="navbar__links">
    @for (link of links; track link.href) {
      <li>
        <a
          [href]="link.href"
          [download]="link.download ?? false"
          (click)="onLinkClick($event, link)"
        >{{ link.label }}</a>
      </li>
    }
  </ul>

  <button class="navbar__toggle" type="button" (click)="toggleMenu()" aria-label="Abrir menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>

<div class="navbar__backdrop" [class.navbar__backdrop--open]="isMenuOpen()" (click)="closeMenu()" aria-hidden="true"></div>

<aside class="navbar__drawer" [class.navbar__drawer--open]="isMenuOpen()">
  <ul class="navbar__drawer-links">
    <li>
      <a class="navbar__drawer-home" href="#inicio" (click)="onHomeClick($event)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 11.5 12 4l8.5 7.5" />
          <path d="M5.5 10v9a1 1 0 0 0 1 1H9.5v-6h5v6h3a1 1 0 0 0 1-1v-9" />
        </svg>
        Início
      </a>
    </li>
    @for (link of links; track link.href) {
      <li>
        <a
          [href]="link.href"
          [download]="link.download ?? false"
          (click)="onLinkClick($event, link)"
        >{{ link.label }}</a>
      </li>
    }
  </ul>

  <ul class="navbar__drawer-social">
    <li>
      <a [href]="socialLinks[0].href" target="_blank" rel="noopener" [attr.aria-label]="socialLinks[0].label">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.38 4.28 5.47v6.27ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45Z"/></svg>
      </a>
    </li>
    <li>
      <a [href]="socialLinks[1].href" target="_blank" rel="noopener" [attr.aria-label]="socialLinks[1].label">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55v-1.94c-3.2.7-3.88-1.54-3.88-1.54-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.8 1.19 1.83 1.19 3.09 0 4.43-2.7 5.4-5.27 5.68.42.36.78 1.08.78 2.18v3.23c0 .3.2.66.79.55A10.5 10.5 0 0 0 23.5 12c0-6.27-5.23-11.5-11.5-11.5Z"/></svg>
      </a>
    </li>
  </ul>
</aside>
